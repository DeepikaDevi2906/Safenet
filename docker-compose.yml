services:

  postgres:

    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safenet

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:

    build: ./backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres


  frontend:

    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:

  postgres_data: